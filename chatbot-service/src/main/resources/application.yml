server:
  port: 8081

spring:
  application:
    name: chatbot-service

plm:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32chars}
    ttl-minutes: ${JWT_TTL_MINUTES:120}
  graph:
    mode: ${GRAPH_MODE:remote}
    host: ${GREMLIN_HOST:localhost}
    port: ${GREMLIN_PORT:8182}
  dynamo:
    endpoint: ${DYNAMO_ENDPOINT:http://localhost:8000}
    region: ${DYNAMO_REGION:us-east-1}
    access-key: ${DYNAMO_ACCESS_KEY:local}
    secret-key: ${DYNAMO_SECRET_KEY:local}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-opus-4-8}
  max-tokens: ${ANTHROPIC_MAX_TOKENS:2048}

logging:
  level:
    root: INFO
    com.plm: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info
